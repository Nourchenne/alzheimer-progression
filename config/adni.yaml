
project:
  name: alzheimer-progression-adni
  seed: 42

paths:                      # relatifs à la racine du projet
  raw: data/raw/adni
  interim: data/interim/adni
  processed: data/processed/adni
  models: models/adni
  results: results/adni

keys:
  id: RID                   # identifiant patient
  visit: VISCODE2           # code de visite harmonisé

tables:                     # nom logique -> fichier (relatif à paths.raw)
  demodx:  phc/ADSP_PHC_DEMODX_03Oct2026.csv              # clinique + diagnostic
  cogn:    phc/ADSP_PHC_COGN_03Oct2026.csv                # cognitif (scores composites)
  mri:     phc/ADSP_PHC_T1_FS_03Oct2026.csv               # IRM FreeSurfer
  amyloid: phc/ADSP_PHC_PET_Amyloid_Simple_03Oct2026.csv  # PET amyloïde
  tau:     phc/ADSP_PHC_PET_Tau_Simple_03Oct2026.csv      # PET tau
  csf:     phc/ADSP_PHC_CSF_03Oct2026.csv                 # biomarqueurs LCR
  plasma:  phc/ADSP_PHC_PLASMA_03Oct2026.csv              # biomarqueurs plasma
  mmse:    adnimerge2/MMSE.csv                            # test MMSE
  fdg:     adnimerge2/UCBERKELEYFDG_8mm.csv               # PET FDG (format long)
  apoe:    adnimerge2/APOERES.csv                         # génétique (1 ligne / patient)

per_patient_tables: [apoe]  # pas de code de visite : jointure sur RID seulement


cohort:                     # définition de la cible (Tâche 3)
  diagnosis_column: PHC_Diagnosis
  date_column: EXAMDATE
  phase_column: PHASE       # phase ADNI de la visite (à la baseline = phase d'inclusion)
  baseline_dx: 2            # MCI au départ
  converted_dx: 3           # démence de type Alzheimer
  excluded_dx: [4, 5]       # démence non-Alzheimer / autre diagnostic
  excluded_visits: [f]      # échecs de screening (non inclus dans l'étude)
  horizon_months: 36        # fenêtre de prédiction
  tolerance_months: 3       # une visite "m36" a lieu entre ~33 et ~39 mois

processed:
  cohort: cohort_mci36.parquet


baseline:                   # table multimodale à la baseline (Tâche 4)
  window_days: [-180, 90]   # mesure retenue : de 6 mois avant à 3 mois après la baseline
  modalities:
    cognitif:
      table: cogn
      date: EXAMDATE
      features: [PHC_MEM, PHC_EXF, PHC_LAN, PHC_VSP]
    mmse:
      table: mmse
      date: VISDATE
      features: [MMSCORE]
    irm:
      table: mri
      date: PHC_SCANDATE
      features: []          # variables calculées dans le code (volumes / volume intracrânien)
    pet_amyloide:
      table: amyloid
      date: PHC_SCANDATE
      features: [PHC_CENTILOIDS]
    pet_fdg:
      table: fdg
      date: EXAMDATE
      features: [MEAN]      # région MetaROI (résumé standard ADNI)
    lcr:
      table: csf
      date: DRAWDATE
      features: [PHC_AB42, PHC_Tau, PHC_pTau181]
    # plasma : écarté (14 % de couverture, concentré sur ADNI3) -> voir rapport

processed_baseline: baseline_multimodal.parquet